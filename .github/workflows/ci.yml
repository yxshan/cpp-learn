name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install modern LLVM
        run: brew install llvm
      - name: Select Reference compiler
        run: echo "CPP_LEARN_REFERENCE_COMPILER=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - name: Report Reference compiler
        run: '"$CPP_LEARN_REFERENCE_COMPILER" --version'
      - run: npm ci
      - run: npm run check
